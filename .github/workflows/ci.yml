name: Offline verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: scripts/verify
      - run: uv run --locked python scripts/check-distributions.py
      - run: uv run --locked python scripts/check-installed.py
